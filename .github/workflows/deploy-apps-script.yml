name: Deploy P4P to Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - "Code.gs"
      - "Index.html"
      - "appsscript.json"
      - ".claspignore"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4p-apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.GAS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure clasp credentials
        env:
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASP_JSON" ] || [ -z "$CLASPRC_JSON" ]; then
            echo "Add CLASP_JSON and CLASPRC_JSON in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$CLASP_JSON" > .clasp.json
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 .clasp.json "$HOME/.clasprc.json"

      - name: Push source and update web app
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          npx --yes @google/clasp@latest push --force
          if [ -n "$GAS_DEPLOYMENT_ID" ]; then
            npx --yes @google/clasp@latest create-deployment \
              --deploymentId "$GAS_DEPLOYMENT_ID" \
              --description "GitHub ${GITHUB_SHA::7}"
            echo "### P4P dashboard deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "https://script.google.com/macros/s/$GAS_DEPLOYMENT_ID/exec" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Source uploaded. Create the initial web app deployment in Apps Script, then add its deployment ID as the GAS_DEPLOYMENT_ID repository secret." >> "$GITHUB_STEP_SUMMARY"
          fi
